name: Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Contenuto web
        run: |
          rm -rf android/www && mkdir -p android/www
          cp index.html sw.js manifest.webmanifest privacy.html icon-*.png apple-touch-icon.png android/www/
          [ -d lib ] && cp -r lib android/www/ || true
      - name: Progetto Android
        working-directory: android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Permessi posizione
        working-directory: android/android
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION app/src/main/AndroidManifest.xml
      - name: Accesso (link profondo)
        working-directory: android/android
        run: |
          python3 ../patch_manifest.py
          grep -c "it.viaticum.app" app/src/main/AndroidManifest.xml
      - name: Widget
        working-directory: android/android
        run: |
          python3 ../widgets/install.py
          grep -c "appwidget.provider" app/src/main/AndroidManifest.xml
      - name: Versione
        working-directory: android/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "version" app/build.gradle
      - name: Icona
        working-directory: android/android
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          src = Image.open("../../icon-512.png").convert("RGBA")
          res = "app/src/main/res"
          for d in ("mipmap-anydpi-v26", "mipmap-anydpi"):
              shutil.rmtree(os.path.join(res, d), ignore_errors=True)
          for n, s in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              os.makedirs(os.path.join(res, "mipmap-" + n), exist_ok=True)
              for f in ("ic_launcher", "ic_launcher_round", "ic_launcher_foreground"):
                  src.resize((s, s), Image.LANCZOS).save(os.path.join(res, "mipmap-" + n, f + ".png"))
          print("icone ok")
          PY
      - name: Compila
        working-directory: android/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log || { grep -E "error:|ERROR:|e: |What went wrong|\.java:[0-9]+|\.xml:[0-9]+|AAPT|Exception" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Firma
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $U aligned.apk
          $BT/apksigner sign --ks android/viaticum.keystore --ks-pass pass:viaticum2026 --key-pass pass:viaticum2026 --ks-key-alias viaticum --out viaticum.apk aligned.apk
          $BT/apksigner verify viaticum.apk
      - name: Firma l'AAB per il Play Store
        if: env.UPLOAD_KEYSTORE_B64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > upload.keystore
          cp android/android/app/build/outputs/bundle/release/app-release.aab viaticum.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.keystore -storepass "$UPLOAD_KEYSTORE_PASSWORD" -keypass "$UPLOAD_KEYSTORE_PASSWORD" viaticum.aab upload
          jarsigner -verify viaticum.aab | head -2
          rm upload.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: viaticum-android
          path: |
            viaticum.apk
            viaticum.aab
          if-no-files-found: ignore
      - name: Pubblica in Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest viaticum.apk $(ls viaticum.aab 2>/dev/null) --title "Viaticum per Android (build ${{ github.run_number }})" --notes "APK da installare a mano. Scaricalo dal telefono e aprilo." --prerelease --target ${{ github.sha }}
