name: Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Contenuto web
        run: |
          rm -rf android/www && mkdir -p android/www
          cp index.html sw.js manifest.webmanifest privacy.html icon-*.png apple-touch-icon.png android/www/
          [ -d lib ] && cp -r lib android/www/ || true
      - name: Progetto Android
        working-directory: android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Permessi posizione
        working-directory: android/android
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION app/src/main/AndroidManifest.xml
      - name: Versione
        working-directory: android/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "version" app/build.gradle
      - name: Icona
        working-directory: android/android
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          src = Image.open("../../icon-512.png").convert("RGBA")
          res = "app/src/main/res"
          for d in ("mipmap-anydpi-v26", "mipmap-anydpi"):
              shutil.rmtree(os.path.join(res, d), ignore_errors=True)
          for n, s in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              os.makedirs(os.path.join(res, "mipmap-" + n), exist_ok=True)
              for f in ("ic_launcher", "ic_launcher_round", "ic_launcher_foreground"):
                  src.resize((s, s), Image.LANCZOS).save(os.path.join(res, "mipmap-" + n, f + ".png"))
          print("icone ok")
          PY
      - name: Compila
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Firma
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $U aligned.apk
          $BT/apksigner sign --ks android/viaticum.keystore --ks-pass pass:viaticum2026 --key-pass pass:viaticum2026 --ks-key-alias viaticum --out viaticum.apk aligned.apk
          $BT/apksigner verify viaticum.apk
      - uses: actions/upload-artifact@v4
        with: { name: viaticum-apk, path: viaticum.apk }
      - name: Pubblica in Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest viaticum.apk --title "Viaticum per Android (build ${{ github.run_number }})" --notes "APK da installare a mano. Scaricalo dal telefono e aprilo." --prerelease --target ${{ github.sha }}
