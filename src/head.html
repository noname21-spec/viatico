.eat ul{margin:0;padding:0;list-style:none}
.eat li{padding:9px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 18%,transparent);font-size:.92rem}.eat li:first-child{border-top:0}
.eat li b a{color:var(--ink);text-decoration:none}
.st{display:inline-block;margin:0 0 0 4px;padding:1px 8px;border-radius:999px;font:800 .7rem Outfit,system-ui,sans-serif;vertical-align:1px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,#1f9d55 16%,transparent);color:#178048}
.st.ko{background:color-mix(in srgb,var(--c2) 16%,transparent);color:var(--c2)}
.st.mid{background:color-mix(in srgb,#d97706 16%,transparent);color:#b45f06}
:root[data-theme="dark"] .st.ok,:root:has(#dm:checked) .st.ok{color:#5ad38e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st.ok{color:#5ad38e}}
li.closed{opacity:.62}
.hrs{display:block;margin-top:3px;color:var(--mute);font-size:.78rem}
.ord{margin-top:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c3) 9%,transparent);border:1px solid color-mix(in srgb,var(--c3) 18%,transparent)}
.ord>b{display:block;font-size:.82rem;margin-bottom:4px}.ord p{margin:4px 0 0;font-size:.85rem;line-height:1.4}.ord i{font-style:normal;font-weight:800}
.subh{margin:22px 0 10px;font-size:1.1rem;letter-spacing:-.01em}
.btw{position:relative;margin:2px 0 14px;padding:4px 0 2px 22px}
.btw::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;border-radius:2px;background:repeating-linear-gradient(180deg,color-mix(in srgb,var(--c3) 55%,transparent) 0 6px,transparent 6px 12px)}
.btwh{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.btwi{position:absolute;left:-1px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;background:var(--gradb);box-shadow:0 0 0 4px var(--bg);animation:btwSpin 4s ease-in-out infinite}
@keyframes btwSpin{0%,70%{transform:none}80%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}
.btwh small{display:block;color:var(--c3);font-weight:800;font-size:.72rem;letter-spacing:.02em}.btwh b{font-size:1rem}
.btwt{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.btwt li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--c2) 8%,transparent);border:1px solid color-mix(in srgb,var(--c2) 18%,transparent)}
.btwt li span{font-size:1.05rem;line-height:1.3}.btwt p{margin:0;font-size:.86rem;line-height:1.4}
.snacks{display:flex;flex-direction:column;gap:8px}
.snk{display:flex;gap:12px;padding:12px 14px;transition:transform .2s}
.snk:active{transform:scale(.98)}
.snk .se{font-size:1.7rem;line-height:1}
.snk b a{color:var(--ink);text-decoration:none}
.snk .sz{display:block;color:var(--c3);font-weight:700;font-size:.78rem;margin-top:2px}
.snk p{margin:6px 0;font-size:.9rem}.snk small{color:var(--mute);font-size:.8rem}
/* ===== voli ===== */
.voli{margin:0 0 16px;padding:12px 14px}
.vh2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.vh2 b{letter-spacing:-.01em}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.vcard{padding:10px 12px 12px;border-radius:var(--r3);display:grid;gap:6px;background:color-mix(in srgb,var(--paper) 18%,transparent);box-shadow:none}
.vleg{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--mute)}
.iata{font:800 .78rem Outfit,system-ui,sans-serif;letter-spacing:.04em;color:#fff;background:var(--gradb);padding:2px 7px;border-radius:7px}
.vleg .pl{font-style:normal;color:var(--c3);font-size:.9rem}
.vrw{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}.vrw span{color:var(--mute);font-weight:600}.vrw b{font-weight:800;text-align:right}
.vlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.vch{font-size:.76rem;font-weight:700;color:var(--c3);text-decoration:none;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--c3) 10%,transparent);border:1px solid color-mix(in srgb,var(--c3) 22%,transparent);white-space:nowrap}
.vch:active{transform:scale(.96)}
.vch[hidden],.vlive[hidden],.vbtn[hidden],.vlnk[hidden]{display:none!important}
.vlive{border-radius:12px;padding:9px 11px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid color-mix(in srgb,var(--ink) 8%,transparent);display:grid;gap:5px;font-size:.84rem;animation:fadeUp .35s ease both}
.vlive .vtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vlive .vpill{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;background:#1f9d55;display:inline-flex;align-items:center;gap:5px}
.vlive .vpill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:vblink 1.6s ease-in-out infinite}
.vlive.warn .vpill{background:#d97706}.vlive.bad .vpill{background:#c81e3a}.vlive.idle .vpill{background:color-mix(in srgb,var(--ink) 45%,transparent)}
.vlive.idle .vpill::before{animation:none}
.vlive .vag{font-size:.7rem;color:var(--mute);font-weight:600}
.vlive .vrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vlive .vrow span{color:var(--mute);font-weight:600;font-size:.76rem}.vlive .vrow b{font-weight:800;text-align:right}
.vlive s{color:var(--mute);font-weight:600;margin-right:4px}.vlive .vdl{color:#d97706;font-weight:800;margin-left:4px}
.vlive .vchips{display:flex;flex-wrap:wrap;gap:5px}
.vlive .vchips i{font-style:normal;font-size:.74rem;font-weight:800;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--c2) 14%,transparent);color:var(--ink)}
.vlive .verr{color:var(--mute);font-weight:600;font-size:.8rem}
@keyframes vblink{50%{opacity:.35}}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.vbar:has(#vref[hidden]):has(#vupd:empty){display:none}
.vbar small{color:var(--mute);font-size:.72rem;font-weight:600}
.vbtn{font:800 .8rem Outfit,system-ui,sans-serif;color:#fff;border:0;border-radius:999px;padding:8px 14px;background:var(--gradb);cursor:pointer;white-space:nowrap;flex:none}
.vbtn:active{transform:scale(.96)}.vbtn:disabled{opacity:.55}
.vcost{margin-top:12px}
.vcost .vcm{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:3px;margin:2px 0 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.vcost .vcm button{height:38px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:800 .82rem Outfit,system-ui,sans-serif;cursor:pointer;transition:background .25s,color .25s}
.vcost .vcm button.on{background:var(--gradb);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.vcost .vcf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-weight:700;font-size:.9rem}
.vcost .vcf span small{display:block;color:var(--mute);font-weight:600;font-size:.74rem}
.vcost .vcin{display:flex;align-items:center;gap:6px;flex:none}
.vcost .vcin input{width:96px;height:44px;padding:0 10px;border-radius:11px;border:1px solid var(--edge);background:color-mix(in srgb,var(--paper) 60%,transparent);color:var(--ink);font:800 1rem Outfit,system-ui,sans-serif;text-align:right;-moz-appearance:textfield}
.vcost .vcin input:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.vcost .vcin i{font-style:normal;font-weight:800;color:var(--mute)}
.vcost .vct{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 9%,transparent);font-weight:800}
.vcost .vcn{margin:8px 0 0;color:var(--mute);font-size:.76rem;line-height:1.4}
.ccpdf{width:100%;justify-content:center;margin:4px 0 14px;min-height:46px}
.vkey{margin-top:10px;border-radius:14px;border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.vkey summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;font-size:.86rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vkey summary::-webkit-details-marker{display:none}
.vkey summary small{font-size:.72rem;font-weight:700;color:var(--mute)}
.vkey.on summary small{color:#1f9d55}
.vkey p,.vkey ol,.vkey .vknote{margin:0 12px 8px;font-size:.8rem;color:var(--mute);line-height:1.45}
.vkey ol{padding-left:18px;list-style:decimal}.vkey ol li{margin:0 0 3px}
.vkey a{color:var(--c3);font-weight:700}
.vkey .vknote{display:block;font-size:.72rem}
.vkrow{display:flex;gap:8px;margin:0 12px 8px}
.vkrow input{flex:1;min-width:0;height:40px;padding:0 10px;border-radius:11px;border:1px solid var(--edge);background:color-mix(in srgb,var(--paper) 55%,transparent);color:var(--ink);font:600 16px Outfit,system-ui,sans-serif}
.vlnk{background:none;border:0;color:#c81e3a;font:700 .78rem Outfit,system-ui,sans-serif;margin:0 12px 10px;padding:0;cursor:pointer}
.vkey[open]>*:not(summary){animation:fadeUp .3s ease both}
/* ===== mappa ===== */
.map{position:relative}
.stage{position:relative;height:clamp(380px,68vh,660px);border-radius:var(--r2);overflow:hidden;background:var(--land);touch-action:pan-y;overscroll-behavior:none}
#lmap[hidden]{display:none}
#lmap{position:absolute;inset:0;z-index:1;background:var(--land);font:500 12px Outfit,system-ui,sans-serif}
.mapoff{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);font-size:.9rem;z-index:0}
.mc{position:absolute;z-index:1000}
.mc-tl{left:10px;top:10px;display:flex;flex-direction:column;gap:6px}.mc-bl{left:10px;bottom:10px}
.mc-tr{right:10px;top:10px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.mc-tr button{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-top:1px solid var(--edge);color:var(--ink);cursor:pointer;font:600 1.3rem Outfit,system-ui,sans-serif;padding:0}
.mc-tr button:first-child{border-top:0}
.mc-tr svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fs .ic2{display:none}#fs.on .ic1{display:none}#fs.on .ic2{display:block}
.sw,#lg{display:flex;align-items:center;gap:8px;font:600 .85rem Outfit,system-ui,sans-serif;color:var(--ink);border-radius:999px;cursor:pointer;min-height:38px;transition:background .25s,transform .2s,box-shadow .2s}
.sw{padding:4px 14px 4px 5px;width:112px}#lg{padding:4px 16px}
.sw i{position:relative;flex:none;width:34px;height:22px;border-radius:11px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--grad)}
.sw[aria-checked="true"] i::after{transform:translateX(12px)}
.mc-tr,.sw,#lg,.lgp.legend{background:linear-gradient(180deg,var(--hi2),transparent 50%),var(--gl);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 6px 16px var(--glsh)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--mute)}
.legend i{display:inline-block;width:22px;height:0;border-top:4px solid;vertical-align:middle;margin-right:5px}
.lgp.legend{position:absolute;left:0;bottom:46px;display:flex;flex-direction:column;flex-wrap:nowrap;gap:7px;width:max-content;max-width:min(80vw,300px);max-height:46vh;overflow:auto;margin:0;padding:10px 12px;border-radius:var(--r3);color:var(--ink);font-size:.82rem}
.lgp[hidden]{display:none}
.map.fs{position:fixed;inset:0;z-index:100;background:var(--paper);margin:0}
html.sa .map.fs{bottom:auto;height:var(--apph)}
.map.fs .stage{height:100%;border-radius:0!important}
.map.fs #info{display:none}
.map.fs .mc-tl,.map.fs .mc-tr{top:calc(10px + env(safe-area-inset-top,0px))}
.map.fs .mc-bl{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
body.fsmap{overflow:hidden}
#info{margin:10px 2px 4px;min-height:60px}#info h3{font-size:1.1rem;margin:0}#info p{margin:4px 0 0;font-size:.92rem}
#info>*{animation:fadeUp .4s ease both}
.lmk{display:grid;place-items:center;cursor:pointer}
.lmk span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font:800 14px Outfit,system-ui,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .2s cubic-bezier(.22,1,.36,1)}
.lmk:active span{transform:scale(.85)}
.lpin span{background:var(--gradb);color:#fff;border:2.5px solid #fff}
.lfd span{background:var(--food);color:#fff;border:2px solid #fff;font-size:11px}
.lph span{background:#fff;border:2.5px solid var(--c2);font-size:14px}
.lwt span{background:#2a8de0;color:#fff;border:2px solid #fff;font-size:10px}
.lap span{background:#fff;color:var(--c3);border:2.5px solid var(--c3);font-size:15px}
.lhm span{border-color:#e0a82e;font-size:16px}
#lmap.far .lmk span{transform:scale(.8)}#lmap.far .lfd span,#lmap.far .lph span,#lmap.far .lwt span{transform:scale(.7)}
.leaflet-tooltip.lst{background:none;border:0;box-shadow:none;padding:0 2px;font:700 11px Outfit,system-ui,sans-serif;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg)}
.leaflet-tooltip.lst::before{display:none}
#lmap.far .leaflet-tooltip.lst:not(.key){display:none}
.leaflet-tooltip.ltip{background:var(--gl);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--edge);color:var(--ink);border-radius:12px;box-shadow:0 6px 16px var(--glsh);font:500 12px Outfit,system-ui,sans-serif}
.leaflet-container{background:var(--land)}
.leaflet-container .leaflet-control-attribution{background:color-mix(in srgb,var(--paper) 70%,transparent);color:var(--mute);font-size:9px;border-radius:8px 0 0 0}
.leaflet-container .leaflet-control-attribution a{color:var(--c3)}
#lmap .leaflet-attribution-flag{display:none!important}
#lmap svg{max-width:none!important}
#lmap .leaflet-tile-pane{transition:filter .5s ease}
#lmap:not(.dk) .leaflet-tile-pane{filter:saturate(.75) contrast(.96)}
#lmap.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.88) saturate(.55)}
.lglass .leaflet-popup-content-wrapper{background:linear-gradient(180deg,var(--hi2),transparent 45%),var(--gl2);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r2);box-shadow:inset 0 1px 0 var(--hi),0 10px 28px var(--glsh)}
.lglass .leaflet-popup-tip{background:var(--gl2);border:1px solid var(--edge)}
.lglass .leaflet-popup-content{margin:12px 14px;font:500 13px/1.4 Outfit,system-ui,sans-serif}
.lglass a.leaflet-popup-close-button{color:var(--mute);top:6px;right:6px}
.lpop b{display:block;font-weight:800;font-size:14px;margin-right:14px}.lpop p{margin:6px 0 8px!important;color:var(--ink)}
.lpa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.lpa .go.sm{margin:0}
.lpm{font-weight:700;font-size:12px;color:var(--c3)!important;text-decoration:none}
.leaflet-popup{animation:popUp .35s cubic-bezier(.22,1,.36,1)}
@keyframes popUp{from{opacity:0;transform:translate3d(0,8px,0) scale(.9)}to{opacity:1;transform:none}}
.route{margin:12px 0 18px;color:var(--mute);font-size:.95rem}
.tips{padding:6px 18px 6px 34px;margin:0 0 18px}.tips li{margin:10px 0}
.shots{margin:12px 0 0;overflow:hidden}
.shots summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.shots summary::-webkit-details-marker{display:none}
.shots summary small{color:var(--c2);font-weight:700}
.shots ul{list-style:none;margin:0;padding:0 14px 6px}
.shots li{display:flex;gap:12px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--ink) 7%,transparent)}
.shots .shi{font-size:1.5rem;line-height:1}
.shots em{font-style:normal;font-size:.75rem;font-weight:700;color:#fff;background:var(--gradb);padding:1px 8px;border-radius:999px;vertical-align:1px}
.shots p{margin:4px 0;font-size:.9rem}.shots small{color:var(--mute);font-size:.8rem}
.shots .meta{margin:0 16px 12px}
.shots[open] ul{animation:fadeUp .35s ease both}
/* ===== costi ===== */
.donut{position:relative;width:min(220px,62vw);margin:4px auto 10px}
.donut svg{display:block;width:100%;height:auto;transform:rotate(-90deg)}
.arc-bg{fill:none;stroke:color-mix(in srgb,var(--ink) 8%,transparent);stroke-width:14}
.arc{fill:none;stroke-width:14;stroke-linecap:round;stroke-dasharray:var(--len) 100;stroke-dashoffset:var(--off)}
.arc.anim{animation:arcIn 1s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.25s + var(--i)*.22s)}
@keyframes arcIn{0%{stroke-dasharray:0 100;opacity:0}12%{opacity:1}100%{stroke-dasharray:var(--len) 100;opacity:1}}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dc b{font:800 1.6rem/1 Outfit,system-ui,sans-serif;letter-spacing:-.02em}.dc span{color:var(--mute);font-size:.85rem;margin-top:4px}.dc small{color:var(--c2);font-weight:700;font-size:.8rem;margin-top:2px}
.dleg{list-style:none;margin:0 0 18px;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 16px;font-size:.88rem}
.dleg li{display:flex;align-items:center;gap:6px}.dleg i{width:10px;height:10px;border-radius:3px}.dleg span{color:var(--mute)}
#costi table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;margin-bottom:8px}
th,td{padding:9px 10px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td:not(:first-child),th:not(:first-child){white-space:nowrap}
th{font:700 .9rem Outfit,system-ui,sans-serif;color:var(--mute);border-top:0}
tr.grp td{font:700 1rem Outfit,system-ui,sans-serif;background:color-mix(in srgb,var(--c3) 9%,transparent)}
tr.tot td{font:800 1.05rem Outfit,system-ui,sans-serif;border-top:2px solid var(--c2)}
tr.tot td:not(:first-child){font-size:1.1rem;color:var(--c3)}
tr.off td{opacity:.45;text-decoration:line-through}
.opt{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--c3);margin:0}
.spese{margin:18px 0 6px;padding:14px}
.spese h3{margin:0 0 10px;font-size:1rem}.spese h3 small{color:var(--mute);font-weight:600}
.who{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.who input{flex:1 1 90px;min-width:0;padding:8px 10px;border-radius:12px;border:1px solid var(--edge);background:color-mix(in srgb,var(--paper) 55%,transparent);color:var(--ink);font:700 .9rem Outfit,system-ui,sans-serif}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.sv{display:flex;flex-direction:column;gap:4px}
.sgrid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--mute);font-weight:600}
.sgrid input{width:100%;padding:9px 10px;border-radius:12px;border:1px solid var(--edge);background:color-mix(in srgb,var(--paper) 55%,transparent);color:var(--ink);font:700 1rem Outfit,system-ui,sans-serif}
.sgrid input:focus,.who input:focus{outline:2px solid var(--c2);outline-offset:1px}
.payer{align-self:flex-start;border:0;border-radius:999px;padding:3px 9px;font:600 .74rem Outfit,system-ui,sans-serif;color:var(--mute);background:color-mix(in srgb,var(--ink) 7%,transparent);cursor:pointer;transition:background .2s,transform .15s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.payer b{color:var(--c3)}.payer:active{transform:scale(.92)}
.payer.p1{background:color-mix(in srgb,var(--c2) 16%,transparent)}.payer.p2{background:color-mix(in srgb,var(--c4) 18%,transparent)}.payer.p3{background:color-mix(in srgb,#1f9d55 16%,transparent)}

/* piccole animazioni: solo dove l'icona è protagonista (giorno scelto, città pronte, tocco) */
@keyframes ibob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.04)}}
@keyframes ifly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-2px) rotate(7deg)}}
@keyframes ispin{to{transform:rotate(360deg)}}
@keyframes iswing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes ipulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes irock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes ipin{0%,100%{transform:translateY(0)}35%{transform:translateY(-3px)}55%{transform:translateY(0) scale(1.06,.94)}}
@keyframes idrip{0%,100%{transform:translateY(-1px) scale(1,1)}50%{transform:translateY(2px) scale(.94,1.07)}}
@keyframes ijig{0%{transform:scale(1)}25%{transform:rotate(-12deg) scale(1.16)}60%{transform:rotate(9deg) scale(1.12)}100%{transform:scale(1)}}
@keyframes ipop{0%{transform:scale(.6) translateY(4px);opacity:.4}60%{transform:scale(1.18) translateY(-2px);opacity:1}100%{transform:scale(1)}}
.dp.on .i3,.dcity.ok .i3{animation:ibob 3.2s ease-in-out infinite}
.dp.on .i3{animation:ipop .6s cubic-bezier(.2,1.4,.4,1) 1,ibob 3.2s ease-in-out .6s infinite}
.dcity.ok:nth-child(3n+2) .i3{animation-delay:-1s}.dcity.ok:nth-child(3n) .i3{animation-delay:-2s}
.dp.on .i3[data-n=plane],.dcity.ok .i3[data-n=plane]{animation:ifly 3.6s ease-in-out infinite}
.dp.on .i3[data-n=gear],.dp.on .i3[data-n=sun]{animation:ispin 14s linear infinite}
.dp.on .i3[data-n=clock],.dp.on .i3[data-n=hourglass],.dcity.ok .i3[data-n=anchor]{animation:iswing 2.8s ease-in-out infinite}
.dp.on .i3[data-n=bulb]{animation:ipulse 2.4s ease-in-out infinite}
.dp.on .i3[data-n=pin]{animation:ipin 2.2s ease-in-out infinite}
.dcity.ok .i3[data-n=bike],.dcity.ok .i3[data-n=train],.dp.on .i3[data-n=train],.dp.on .i3[data-n=bike]{animation:irock 2.8s ease-in-out infinite}
.dp.on .i3[data-n=drop]{animation:idrip 2.6s ease-in-out infinite}
button:active .i3,.dcity:active .i3,label:active .i3,.row:active .i3{animation:ijig .55s ease-in-out 1}
@media (hover:hover){button:hover .i3,.dcity:hover .i3,label:hover .i3{animation:ijig .6s ease-in-out 1}}
@media (prefers-reduced-motion:reduce){.i3{animation:none!important}}
